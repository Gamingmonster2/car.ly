<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cars Libya | سوق السيارات في ليبيا</title>
    <meta name="description" content="منصة cars.com.ly لبيع وشراء السيارات في ليبيا. تواصل مباشر عبر الواتساب وسهولة تامة في التصفح." />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:title" content="Cars Libya | سوق السيارات في ليبيا" />
    <meta property="og:description" content="منصة cars.com.ly لبيع وشراء السيارات في ليبيا. تواصل مباشر عبر الواتساب وسهولة تامة في التصفح." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // في حال فتح المستخدم ملف index.html مباشرة من القرص (file://) بدون خادم
      if (window.location.protocol === 'file:') {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.children.length === 0) {
            var box = document.createElement('div');
            box.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;z-index:999999;font-family:system-ui,sans-serif;padding:20px;direction:rtl;text-align:center;';
            box.innerHTML =
              '<div style="max-width:560px;background:#1e293b;border:1px solid #334155;border-radius:24px;padding:32px;box-shadow:0 25px 50px rgba(0,0,0,0.5);">' +
              '<div style="font-size:42px;margin-bottom:12px;">🚗</div>' +
              '<h2 style="font-size:22px;font-weight:900;margin-bottom:12px;color:#38bdf8;">مشروع سوق السيارات (CARS.COM.LY)</h2>' +
              '<p style="font-size:14px;color:#cbd5e1;line-height:1.7;margin-bottom:20px;">لقد فتحت الملف مباشرة عبر المتصفح (file://) وهذا مشروع مبني بـ React + Vite، لذلك يحتاج إلى تشغيله بأحد الطريقتين:</p>' +
              '<div style="background:#090d16;border:1px solid #1e293b;padding:14px;border-radius:14px;text-align:left;direction:ltr;font-family:monospace;font-size:13px;color:#4ade80;">npm install<br>npm run dev</div>' +
              '<p style="font-size:12px;color:#64748b;line-height:1.5;margin-top:16px;">أو اضغط مرتين على ملف <strong style="color:#e2e8f0;">start.bat</strong> المرفق في المجلد لتشغيله بنقرة واحدة، ثم افتح http://localhost:3000</p>' +
              '</div>';
            document.body.appendChild(box);
          }
        }, 1200);
      }
    </script>
  </body>
</html>
